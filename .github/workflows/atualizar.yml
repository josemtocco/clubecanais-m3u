name: Atualizar playlist ClubeCanais
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atualizar-clubecanais
  cancel-in-progress: true
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium
      - name: Gerar M3U por categoria
        env:
          MAX_CONCURRENCY: '8'
          HTTP_TIMEOUT: '20'
          BROWSER_WAIT_MS: '1800'
        run: python gerar_m3u.py
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clubecanais.m3u canais.json cxtv-discovery.json
          if git diff --cached --quiet; then echo 'Nenhuma alteração.'; else git commit -m 'Atualiza playlist ClubeCanais'; git push; fi
