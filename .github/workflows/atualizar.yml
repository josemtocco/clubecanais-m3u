name: Atualizar playlist ClubeCanais

on:
  schedule:
    # GitHub Actions usa UTC. 00, 06, 12 e 18 UTC = 21, 03, 09 e 15 BRT.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-clubecanais
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Chromium para fallback de JavaScript
        run: python -m playwright install --with-deps chromium

      - name: Gerar M3U
        env:
          MIN_VALID_CHANNELS: '5'
          MAX_CONCURRENCY: '10'
          HTTP_TIMEOUT: '20'
        run: python gerar_m3u.py

      - name: Publicar alterações
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clubecanais.m3u canais.json cxtv-discovery.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração na playlist.'
          else
            git commit -m "Atualiza playlist ClubeCanais"
            git push
          fi
